name: Simple CI Pipeline

# 1. Define when this pipeline should run (Triggers)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define what jobs to run
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Runs on a clean cloud-hosted Linux virtual machine

    steps:
    # Step A: Download your repository code onto the cloud machine
    - name: Checkout code
      uses: actions/checkout@v4

    # Step B: Set up Python (since your earlier project was Python)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step C: Run a test command to simulate automated checks
    - name: Run a diagnostic test
      run: |
        echo "Running automated checks on cloud server..."
        python3 --version
        echo "Pipeline test passed successfully!"